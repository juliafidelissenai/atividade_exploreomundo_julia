<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="folha_estilo.css">
</head>
<body>
    <body>
    <header class="cabecalho">
        <div class="logo">
            <i class="fa-solid fa-earth-americas"></i>
            <span>Explore o Mundo</span>
        </div>
        <div class="navegacao">
            <nav class="menu-links">
                <a href="index.html">Inicio</a>
                <a href="destinos.html">Destinos</a>
                <a href="sobre.html">Sobre</a>
                <a href="">Contato</a>
            </nav>
            <div class="redes-sociais">
                <a href="" class="whatsapp"><i class="fa-brands fa-whatsapp"></i></a>
                <a href="" class="face"><i class="fa-brands fa-facebook"></i></a>
                <a href="" class="insta"><i class="fa-brands fa-square-instagram"></i></a>
                <a href="" class="twitter"><i class="fa-brands fa-x-twitter"></i></a>
            </div>
        </div>
    </header><!--finalizadoo cabeçalho-->

    <main class="Container">
        <h1>Cadastro para mais informaçoes</h1>
        <p class="subtitulo">Preencha seus dados para receber informações e notificaçoes</p>

        <div class="area-incrição">

            <form action="/processar-cadastro" method="post" class="coluna-form">

                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required minlength="3" maxlength="50"><br>

                <label for="senha">Senha de acesso:</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required minlength="8" maxlength="15"><br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="exemplo@dominio.com" required><br>

                <label for="data_nasc">Data de nascimento:</label>
                <input type="date" id="data_nasc" name="data_nascimneto" min="1900-01-01" max="2026-12-31" required><br>

                <label>Viagens de interesse:</label><br>
                <input type="radio" id="turno" name="turno" value="manha" required>
                <label for="turno_manha">Nacionais</label><br>
                <input type="radio" id="turno_tarde" name="tarde" value="tarde">
                <label for="turno_tarde">Internacionais</label><br>


                <label for="unidade">Selecione a sua cidade</label><br>
                <select name="unidade" id="unidade" required>
                    <option value="" disa selected>Selecione uma cidade</option>
                    <option value="sp">São Paulo-capital</option>
                    <option value="sebastianopolis">Rio de Janeiro</option>
                    <option value="votuporanga">Porto Seguro</option>
                    <option value="valentim gentil">São José do rio preto</option>

                </select>
                <input type="checkbox" id="termos" name="termos" required>
                <label for="termos">Li e aceito os termos</label><br><br>

                <button type="submit" class="btn-cadastrar">cadastrar</button>
                



            </form>

            <div class="coluna-midia">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d467692.39586770936!2d-46.92497623390739!3d-23.681434523666315!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce448183a461d1%3A0x9ba94b08ff335bae!2zU8OjbyBQYXVsbywgU1A!5e0!3m2!1spt-BR!2sbr!4v1790880627828!5m2!1spt-BR!2sbr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>">

                </iframe>
            </div>

            <article class="empresa visual">
            <img class="poster" src="foto  fachada da empresa.png" alt="fachada empresa">
        </article>

        <article class="empresa foto">
            <img class="foto" src="foto interior empresa.png" alt="interior empresa">
        </article>

        <footer class="rodape">
        <p>© 2026 Explore o mundo - Todos os direitos reservados.</p>
        </footer>


    </main>
</body>
</html>
